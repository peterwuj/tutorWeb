<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math – Ninja Learn</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <style>
    nav  { background: #0a4a58; border-bottom-color: #00d2ff; }
    .hero h1 { color: #00d2ff; }

    @keyframes cardRise {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
    .card-grid .card { opacity: 0; animation: cardRise .55s ease forwards; }
    .card-grid .card:nth-child(1) { animation-delay: .25s; }
    .card-grid .card:nth-child(2) { animation-delay: .40s; }
    .card-grid .card:nth-child(3) { animation-delay: .55s; }
    .card-grid .card:nth-child(4) { animation-delay: .70s; }

    .card:hover .icon { display: inline-block; animation: iconSpin .4s ease; }
    @keyframes iconSpin {
      0%   { transform: rotate(0deg)   scale(1);    }
      50%  { transform: rotate(180deg) scale(1.3);  }
      100% { transform: rotate(360deg) scale(1);    }
    }
  </style>
</head>
<body>

<nav>
  <span class="logo">🥷 Ninja Learn</span>
  <a href="index.html">Home</a>
  <a href="math.html" class="active">Math</a>
  <a href="chinese.html">Chinese</a>
</nav>

<div class="hero">
  <h1>🧮 Math Dojo</h1>
  <p>Pick a math mission, young ninja! ⭐</p>
</div>

<div class="card-grid">
  <a class="card numbers" href="numbers.html">
    <span class="icon">📜</span>
    <h2>Numbers</h2>
    <p>Learn numbers 1 – 20</p>
  </a>
  <a class="card addition" href="addition.html">
    <span class="icon">⚔️</span>
    <h2>Addition</h2>
    <p>Add numbers up to 20</p>
  </a>
  <a class="card subtraction" href="subtraction.html">
    <span class="icon">🗡️</span>
    <h2>Subtraction</h2>
    <p>Subtract numbers within 20</p>
  </a>
  <a class="card multiplication" href="multiplication.html">
    <span class="icon">🌟</span>
    <h2>Multiplication</h2>
    <p>Times tables 1 – 10</p>
  </a>
</div>

<script src="sounds.js"></script>
<script src="ninja-avatar.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const ninjaCorner = Object.assign(document.createElement('div'), {
    style: 'position:fixed;bottom:16px;right:16px;z-index:50'
  });
  document.body.appendChild(ninjaCorner);
  const mathNinja = new NinjaAvatar(ninjaCorner, { size: 110 });
  mathNinja.pose('wave').say('Time to train! 🧮', 2600);
  setTimeout(() => mathNinja.pose('idle'), 2800);

  document.querySelectorAll('.card').forEach(el => {
    el.addEventListener('mouseenter', playHover);
    el.addEventListener('click', playTap);
  });
});
</script>
</body>
</html>
